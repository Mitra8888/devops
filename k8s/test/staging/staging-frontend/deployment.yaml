apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-frontend
  labels:
    app: staging-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staging-frontend
  template:
    metadata:
      labels:
        app: staging-frontend
    spec:
      containers:
        - name: staging-frontend
          image: uros02/mitra88-devops-frontend:1.21
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config