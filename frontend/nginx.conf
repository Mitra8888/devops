server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.csr.html index.html;

    location / {
        try_files $uri $uri/ /index.csr.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
