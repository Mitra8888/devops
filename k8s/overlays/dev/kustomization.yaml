apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: dev

patches:
  - path: frontend-replicas.yaml
    target:
      kind: Deployment
      name: frontend-deployment

  - path: backend-replicas.yaml
    target:
      kind: Deployment
      name: backend-deployment

namePrefix: dev-

nameSuffix: -v1
