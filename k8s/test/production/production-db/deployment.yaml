apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-mongodb-deployment
  namespace: production
  labels:
    app: production-mongodb
spec:
  replicas: 3
  selector:
    matchLabels:
      app: production-mongodb
  template:
    metadata:
      labels:
        app: production-mongodb
    spec:
      containers:
      - name: production-mongodb
        image: mongo:8.0
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: production-mongodb-data
          mountPath: /data/db
      volumes:
      - name: production-mongodb-data
        persistentVolumeClaim:
          claimName: production-mongodb-pvc
