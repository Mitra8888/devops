apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend-deployment 
  labels:
    app: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app-backend
        image: app-backend
        ports:
        - containerPort: 3000
        
