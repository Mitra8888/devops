apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-backend-deployment
  namespace: production
  labels:
    app: production-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: production-backend
  template:
    metadata:
      labels:
        app: production-backend
    spec:
      containers:
        - name: production-backend
          image: uros02/mitra88-devops-backend:1.21
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URI
              value: "mongodb://production-mongodb-service:27017/myappdb"