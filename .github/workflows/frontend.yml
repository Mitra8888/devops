name: Frontend e2e

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
jobs:
    e2e-tests:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20.x
            
            - name: Install front Dependencies
              run: |
                cd frontend
                npm ci


            - name: Install back Dependencies
              run: |
                cd backend
                npm ci
              
            
            - name: Start backend (Port 3000)
              run: | 
                cd backend
                nohup npm start > ../backend.log 2>&1 &

            - name: Start frontend (Port 4200)
              run: |
                cd frontend
                nohup npm start -- --host 0.0.0.0 --port 4200 > ../frontend.log 2>&1 &

            - name: Wait for server
              run: |
                npx wait-on http-get://localhost:4200 http-get://localhost:3000 
            
            - name: Run Cypress tests
              uses: cypress-io/github-action@v6
              with:
                working-directory: frontend
                spec: cypress/e2e/login-test/login-test.cy.ts
            
