sonar.host.url=http://sonarqube:9000
sonar.projectKey=devops-frontend
sonar.projectName=devops-frontend
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/dist/**,**/.angular/**

sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

sonar.typescript.lcov.reportPaths=coverage/devops-frontend/lcov.info

sonar.javascript.node.maxspace=2048
sonar.javascript.exclusions=**/*.html
sonar.html.file.suffixes=.html