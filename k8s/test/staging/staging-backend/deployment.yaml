apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-backend
  namespace: staging
  labels:
    app: staging-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staging-backend
  template:
    metadata:
      labels:
        app: staging-backend
    spec:
      containers:
        - name: staging-backend
          image: uros02/mitra88-devops-backend:1.21
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URI 
              value: "mongodb://staging-mongodb-service:27017/myappdb"