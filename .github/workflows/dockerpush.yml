name: docker build and push

on:
    workflow_run:
        workflows: ["frontend"]
        types:
            - completed

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Log in to docker hub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKER_USERNAME}}
                password: ${{secrets.DOCKER_TOKEN}}

            - name: set up tags
              run: |
                VERSION="1.${GITHUB_RUN_NUMBER}"
                echo "VERSION=$VERSION" >> $GITHUB_ENV

                PROJECT_NAME="devapp"
                echo "PROJECT=NAME=$PROJECT_NAME" >> $GITHUB_ENV
            
            - name: Build docker images with docker compose
              run: |
                 docker compose -p "$PROJECT_NAME" build

            - name: Retag and Push images
              run: |
                FRONTEND_REPO="uros02/mitra88-devapp-frontend"
                FRONTEND_IMAGE_ID=$(docker images -q ${PROJECT_NAME}-devapp-frontend)

                docker tag $FRONTEND_IMAGE_ID $FRONTEND_REPO:latest
                docker push $FRONTEND_REPO:latest

                docekr tag $FRONTEND_IMAGE_ID $FRONTEND_REPO:$VERSION
                docker push $FRONTEND_REPO:$VERSION

                BACKEND_REPO="uros02/mitra88-devapp-backend"
                BACKEND_IMAGE_ID=$(docker images -q ${PROJECT_NAME}-devapp-backend)

                docker tag $BACKEND_IMAGE_ID $BACKEND_REPO:latest
                docker push $BACKEND_REPO:latest

                docker tag $BACKEND_IMAGE_ID $BACKEND_REPO:$VERSION
                docker push $BACKEND_REPO:$VERSION

            