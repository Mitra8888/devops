apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-frontend-deployment
  namespace: production
  labels:
    app: production-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: production-frontend
  template:
    metadata:
      labels:
        app: production-frontend
    spec:
      containers:
        - name: production-frontend
          image: uros02/mitra88-devops-frontend:1.21
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config